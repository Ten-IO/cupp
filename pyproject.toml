[project]
name = "cupp"
version = "3.3.1"
description = "Common User Passwords Profiler (CUPP)"
license = { text = "GNU General Public License v3.0" }

[project.scripts]
cupp = "cupp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cupp"]